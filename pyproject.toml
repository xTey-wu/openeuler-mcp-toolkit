[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openeuler-mcp-toolkit"
version = "1.0.0"
description = "Read-only openEuler/Linux observability and operating-system algorithm tools exposed through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Junze Wu" }]
keywords = ["mcp", "openeuler", "linux", "operating-system", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.25,<2",
  "psutil>=7,<8",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "mcp[cli]>=1.25,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
openeuler-mcp = "openeuler_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: starts a real MCP subprocess",
  "linux: requires Linux-specific system interfaces",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
